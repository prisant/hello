[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hello"
version = "0.1.0"
description = "A tiny greeter app"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Your Name", email = "you@example.com"},
]
maintainers = [
    {name = "Your Name", email = "you@example.com"},
]
keywords = ["greeting", "cli", "example"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Utilities",
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "mkdocs>=1.5",
    "mkdocs-material>=9.0",
]

[project.scripts]
hello = "hello.main:main"

[project.urls]
Homepage = "https://github.com/yourname/hello"
Repository = "https://github.com/yourname/hello"
Issues = "https://github.com/yourname/hello/issues"
Documentation = "https://yourname.github.io/hello"
Changelog = "https://github.com/yourname/hello/blob/main/CHANGELOG.md"

[tool.pytest.ini_options]
testpaths = ["tests"]
