[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hello"
version = "0.1.0"
description = "A tiny greeter app"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Michael G. Prisant", email = "info@prisantscientific.org"},
]
maintainers = [
    {name = "Michael G. Prisant", email = "info@prisantscientific.org"},
]
keywords = ["greeting", "cli", "example"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Utilities",
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov",
    "ruff",
    "mypy",
    "mkdocs>=1.5",
    "mkdocs-material>=9.0",
]

[project.scripts]
hello = "hello.main:main"

[project.urls]
Homepage = "https://github.com/prisant/hello"
Repository = "https://github.com/prisant/hello"
Issues = "https://github.com/prisant/hello/issues"
Documentation = "https://prisant.github.io/hello"
Changelog = "https://github.com/prisant/hello/blob/main/CHANGELOG.md"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.10"
strict = true
